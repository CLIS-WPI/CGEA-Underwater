[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgea"
version = "0.1.0"
description = "Connectivity-Governed Execution Authority experimental platform for intermittently connected underwater networks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CGEA Research" }]
dependencies = [
  "numpy>=2.0.0",
  "scipy>=1.13.0",
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "simpy>=4.1.1",
  "networkx>=3.3",
  "matplotlib>=3.9.0",
  "tqdm>=4.66.0",
  "pytest>=8.2.0",
]

[project.optional-dependencies]
phy = ["sionna>=2.1.0,<2.2.0", "aubellhop>=0.2.0", "torch>=2.9.0"]

[project.scripts]
cgea-run = "cgea.experiments.cli:main"
cgea-verify = "cgea.experiments.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 180
markers = [
  "slow: longer integration tests",
  "gpu: requires CUDA",
  "bellhop: requires aubellhop binary",
]
