# FROZEN governance thresholds — shared across E1–E5 (do not tune per experiment).
soft_expiry_s: 300.0
hard_expiry_s: 900.0
authority_refresh_s: 60.0
authority_capsule_bytes: 256
freshness_mode: continuous  # continuous | binary | disabled
immediate_resume: false

# Packetized reconciliation (not a freshness-threshold retune).
reconciliation:
  digest_max_retries: 3
  digest_retry_s: 20.0
  digest_bytes: 128
  provenance_bytes: 256
  reconcile_bytes: 128

freshness:
  aging_age_s: 180.0
  stale_age_s: 400.0

connectivity:
  pdr_degraded: 0.7
  pdr_partition: 0.3
  supervisor_timeout_s: 120.0
  authority_timeout_s: 300.0
  min_throughput_bps: 100.0
