# FROZEN governance thresholds — shared across E1–E5 (do not tune per experiment).
soft_expiry_s: 300.0
hard_expiry_s: 900.0
authority_refresh_s: 60.0
authority_capsule_bytes: 256
freshness_mode: continuous  # continuous | binary | disabled
immediate_resume: false

# Predeclared paper capsule grants (2026-09-28). Not an oracle copy, not a
# hidden retune of aging/stale/hard expiry. E1-v3 used implicit broad=True.
policy_version: paper_risk_bounded_v1_2026-09-28
capsule_grants:
  conditional:
    - reassign_another_auv
  forbid:
    - enter_exclusion_zone
    - exceed_return_energy_reserve
    - abandon_mandatory_inspection
    - change_high_level_objective

# Packetized reconciliation (not a freshness-threshold retune).
# Per-AUV DIGEST→PROVENANCE→RECONCILE→AUTHORITY; no all-clear barrier.
# Metric freeze: safe_useful_retention_v1_2026-09-28
#   = ALLOW ∩ {mission_beneficial ∧ ¬violates_frozen_risk}
#     / proposed ∩ {mission_beneficial ∧ ¬violates_frozen_risk}
reconciliation:
  digest_max_retries: 3
  digest_retry_s: 20.0
  digest_bytes: 128
  provenance_bytes: 256
  reconcile_bytes: 128

freshness:
  aging_age_s: 180.0
  stale_age_s: 400.0

connectivity:
  pdr_degraded: 0.7
  pdr_partition: 0.3
  supervisor_timeout_s: 120.0
  authority_timeout_s: 300.0
  min_throughput_bps: 100.0
