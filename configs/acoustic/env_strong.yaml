# Stronger but still realistic shallow-water overlay. Deterministic scenario, not seed.
environment_id: paper_ssp_200m_strong_v1
water_depth_m: 200.0
carrier_frequency_hz: 25000.0
bandwidth_hz: 5000.0
noise_psd_dbm_hz: -44.0
tx_power_dbm: 60.0
snr_threshold_db: 12.0
prefer_aubellhop: true
allow_fallback: false
use_sionna_bridge: true
use_gpu_phy: true
doppler_mode: not_modeled

ssp:
  depths_m: [0.0, 30.0, 80.0, 140.0, 200.0]
  speeds_mps: [1525.0, 1500.0, 1496.0, 1508.0, 1522.0]

bottom:
  soundspeed_mps: 1650.0
  density_ratio: 1.7
  attenuation_db_per_wavelength: 0.8

surface:
  boundary: vacuum
  roughness_m: 0.15
