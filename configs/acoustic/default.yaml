# FROZEN acoustic parameters for paper validation runs.
# Do not change mid-experiment. Unit tests may override allow_fallback locally.
environment_id: paper_ssp_200m_v1
water_depth_m: 200.0
carrier_frequency_hz: 25000.0
bandwidth_hz: 5000.0
# Link budget uses Bellhop TL: SNR ≈ tx_power - TL - noise.
# Tuned so PSP/rate decay with range under frozen geometry.
noise_psd_dbm_hz: -50.0
tx_power_dbm: 60.0
snr_threshold_db: 12.0
prefer_aubellhop: true
allow_fallback: false          # CRITICAL: paper runs must never use image-multipath
use_sionna_bridge: true        # CRITICAL: Bellhop paths must enter Sionna ChannelModel
use_gpu_phy: true              # Bellhop CIR → batched OFDM Monte Carlo on GPU
doppler_mode: not_modeled      # static CIR; no along-path Doppler in the PHY

ssp:
  depths_m: [0.0, 50.0, 100.0, 200.0]
  speeds_mps: [1520.0, 1510.0, 1505.0, 1515.0]

bottom:
  soundspeed_mps: 1600.0
  density_ratio: 1.5
  attenuation_db_per_wavelength: 0.5

surface:
  boundary: vacuum
  roughness_m: 0.0
